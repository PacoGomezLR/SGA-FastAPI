name: Backend tests

"on":
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    env:
      # Los tests usan SQLite en memoria (ver tests/conftest.py); estas
      # variables solo existen para que Settings() valide al importar
      # app.main, no apuntan a ninguna base de datos real.
      DATABASE_URL: "sqlite:///:memory:"
      SECRET_KEY: ci_test_secret_key_de_al_menos_32_caracteres

    steps:
      - uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Ejecutar tests
        run: pytest tests/ -v
